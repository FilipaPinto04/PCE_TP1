version: "3.7"

services:
  fhir:
    image: hapiproject/hapi:latest
    container_name: hapi-fhir
    ports:
      - "9090:8080"
    depends_on:
      - db
    volumes:
      - ./hapi.application.yaml:/app/config/application.yaml:ro

  db:
    image: postgres:16
    container_name: hapi-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "tp1"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  ehrdb:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    container_name: ehrbase-postgres
    environment:
      - POSTGRES_DB=ehrbase
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5434:5432"
    volumes:
      - ./init-ehr.sql:/docker-entrypoint-initdb.d/init-ehr.sql

  ehrbase:
    image: ehrbase/ehrbase:2.31.0
    container_name: ehrbase
    depends_on:
      ehrdb:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://ehrdb:5432/ehrbase
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: postgres
      SECURITY_AUTHTYPE: none

  api:
    build: .
    container_name: integration-service
    ports:
      - "5000:5000"
    depends_on:
      - db
      - fhir
      - ehrbase
    volumes:
      - ./templates:/app/templates